<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0e27">
    <title>Connexion - AI Python Tutor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }
        
        .login-container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .login-logo {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: gentlePulse 4s ease-in-out infinite;
        }
        
        .login-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--electric-blue);
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }
        
        .login-subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        
        .form-container {
            background: rgba(26, 31, 58, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2.5rem;
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-deep);
            animation: fadeInUp 0.5s ease-out;
        }
        
        .input-group {
            margin-bottom: 1.5rem;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 0.95rem;
        }
        
        .password-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .input-group input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: rgba(10, 14, 39, 0.8);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            box-sizing: border-box;
        }
        
        .password-input-wrapper input {
            padding-right: 2.8rem;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: var(--electric-blue);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.2);
            background: rgba(10, 14, 39, 0.95);
        }
        
        .input-group input::placeholder {
            color: var(--text-muted);
        }
        
        .password-toggle-btn {
            position: absolute;
            right: 0.75rem;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0.5rem;
            transition: all 0.3s;
            min-width: 44px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .password-toggle-btn:hover {
            color: var(--electric-blue);
            transform: scale(1.1);
        }
        
        .submit-btn {
            width: 100%;
            padding: 1rem 2rem;
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
            margin-top: 1rem;
            position: relative;
            overflow: hidden;
        }
        
        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }
        
        .submit-btn:hover::before {
            left: 100%;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.6);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .submit-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .form-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }
        
        .form-footer p {
            color: var(--text-secondary);
            margin: 0;
        }
        
        .form-footer a {
            color: var(--electric-blue);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .form-footer a:hover {
            color: var(--accent-cyan);
            text-decoration: underline;
        }
        
        .message-box {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
            animation: slideDown 0.3s ease-out;
        }
        
        .message-box.show {
            display: block;
        }
        
        .info-message {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid var(--electric-blue);
            color: var(--electric-blue);
        }
        
        .error-message {
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid var(--error-red);
            color: var(--error-red);
        }
        
        .success-message {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--success-green);
            color: var(--success-green);
        }
        
        .message-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }
        
        .message-detail {
            font-size: 0.9rem;
            line-height: 1.5;
        }
        
        .message-detail + .message-detail {
            margin-top: 0.4rem;
        }
        
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        
        .submit-btn.loading .loading-spinner {
            display: inline-block;
        }
        
        .submit-btn.loading .btn-text {
            display: none;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .login-container {
                max-width: 100%;
            }
            
            .form-container {
                padding: 2rem 1.5rem;
            }
            
            .login-title {
                font-size: 1.8rem;
            }
            
            .login-logo {
                font-size: 2.5rem;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 0.5rem;
            }
            
            .form-container {
                padding: 1.5rem 1rem;
            }
            
            .login-title {
                font-size: 1.5rem;
            }
            
            .login-subtitle {
                font-size: 0.85rem;
            }
            
            .input-group input {
                padding: 0.75rem 1rem;
                padding-right: 2.8rem;
                font-size: 0.9rem;
            }
            
            .submit-btn {
                padding: 0.9rem 1.5rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="grid-overlay"></div>
    
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">🤖</div>
            <h1 class="login-title">AI TUTOR</h1>
            <p class="login-subtitle">Connectez-vous pour commencer à apprendre</p>
        </div>
        
        <div class="form-container">
            <div id="infoMessage" class="message-box info-message"></div>
            <div id="errorMessage" class="message-box error-message"></div>
            <div id="successMessage" class="message-box success-message"></div>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Entrez votre nom d'utilisateur"
                        required 
                        autocomplete="username"
                    >
                </div>
                
                <div class="input-group">
                    <label for="password">Mot de passe</label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Entrez votre mot de passe"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="password-toggle-btn" id="passwordToggle" title="Afficher/Masquer">
                            👁️
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">Se connecter</span>
                    <div class="loading-spinner"></div>
                </button>
            </form>
            
            <div class="form-footer">
                <p>Pas encore de compte ? <a href="register.html">S'inscrire gratuitement</a></p>
            </div>
        </div>
    </div>

    <script>
        const errorMessage = document.getElementById('errorMessage');
        const infoMessage = document.getElementById('infoMessage');
        const successMessage = document.getElementById('successMessage');
        const submitBtn = document.getElementById('submitBtn');
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('passwordToggle');
        
        // ✅ Toggle affichage/masquage du mot de passe
        passwordToggle.addEventListener('click', (e) => {
            e.preventDefault();
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordToggle.textContent = '👁️‍🗨️';
                passwordToggle.title = 'Masquer le mot de passe';
            } else {
                passwordInput.type = 'password';
                passwordToggle.textContent = '👁️';
                passwordToggle.title = 'Afficher le mot de passe';
            }
        });
        
        function showInfo(title, details = []) {
            infoMessage.innerHTML = `
                <div class="message-title">ℹ️ ${title}</div>
                ${details.map(detail => `<div class="message-detail">• ${detail}</div>`).join('')}
            `;
            infoMessage.classList.add('show');
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
            
            setTimeout(() => {
                infoMessage.classList.remove('show');
            }, 8000);
        }
        
        function showError(title, details = []) {
            errorMessage.innerHTML = `
                <div class="message-title">❌ ${title}</div>
                ${details.map(detail => `<div class="message-detail">• ${detail}</div>`).join('')}
            `;
            errorMessage.classList.add('show');
            infoMessage.classList.remove('show');
            successMessage.classList.remove('show');
            
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 6000);
        }
        
        function showSuccess(message) {
            successMessage.innerHTML = `<div class="message-title">${message}</div>`;
            successMessage.classList.add('show');
            errorMessage.classList.remove('show');
            infoMessage.classList.remove('show');
        }
        
        function checkLogoutStatus() {
            const wasLoggedOut = sessionStorage.getItem('wasLoggedOut');
            
            if (wasLoggedOut) {
                showInfo(
                    'Vous avez été déconnecté',
                    [
                        'Vous avez été déconnecté avec succès',
                        'Veuillez vous reconnecter pour accéder à votre compte'
                    ]
                );
                sessionStorage.removeItem('wasLoggedOut');
            }
        }
        
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                showError('Champs manquants', [
                    !username ? 'Veuillez entrer votre nom d\'utilisateur' : '',
                    !password ? 'Veuillez entrer votre mot de passe' : ''
                ].filter(Boolean));
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.classList.add('loading');
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('sessionId', data.session_id);
                    localStorage.setItem('userId', data.user_id);
                    localStorage.setItem('username', data.username);
                    
                    sessionStorage.removeItem('wasLoggedOut');
                    sessionStorage.removeItem('comeFromAnonymous');
                    
                    showSuccess('✅ Connexion réussie ! Redirection en cours...');
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    if (response.status === 401) {
                        showError('Identifiants incorrects', [
                            'Le nom d\'utilisateur ou le mot de passe est incorrect',
                            'Vérifiez que les majuscules/minuscules sont correctes'
                        ]);
                    } else if (response.status === 404) {
                        showError('Utilisateur non trouvé', [
                            `L'utilisateur "${username}" n'existe pas`,
                            'Vérifiez le nom d\'utilisateur',
                            'N\'avez-vous pas encore de compte ? Cliquez sur "S\'inscrire"'
                        ]);
                    } else if (response.status === 400) {
                        showError('Erreur de validation', [
                            data.error || 'Les données sont invalides',
                            'Vérifiez votre saisie et réessayez'
                        ]);
                    } else if (response.status === 500) {
                        showError('Erreur serveur', [
                            'Une erreur s\'est produite sur le serveur',
                            'Veuillez réessayer dans quelques instants'
                        ]);
                    } else {
                        showError('Erreur de connexion', [
                            data.error || 'Une erreur est survenue',
                            'Vérifiez votre connexion internet et réessayez'
                        ]);
                    }
                    
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('loading');
                }
            } catch (error) {
                console.error('Erreur:', error);
                showError('Erreur de connexion au serveur', [
                    'Impossible de se connecter au serveur',
                    'Assurez-vous que le serveur est démarré',
                    'Vérifiez votre connexion internet'
                ]);
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
            }
        });
        
        window.addEventListener('DOMContentLoaded', () => {
            const userId = localStorage.getItem('userId');
            const sessionId = localStorage.getItem('sessionId');
            
            if (userId && sessionId) {
                showSuccess('✅ Vous êtes déjà connecté ! Redirection...');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } else {
                // ✅ Vérifier si l'utilisateur vient du mode anonyme
                const comeFromAnonymous = sessionStorage.getItem('comeFromAnonymous');
                if (comeFromAnonymous) {
                    showInfo(
                        'Vous avez utilisé votre essai gratuit',
                        [
                            'Créez un compte maintenant pour continuer votre apprentissage',
                            'Accédez aux conversations illimitées et aux exercices interactifs'
                        ]
                    );
                    sessionStorage.removeItem('comeFromAnonymous');
                } else {
                    checkLogoutStatus();
                }
            }
        });
    </script>
</body>
</html>

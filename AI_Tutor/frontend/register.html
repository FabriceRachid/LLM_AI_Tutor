<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - AI Python Tutor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grid-overlay"></div>
    
    <div class="container">
        <div class="form-container" style="max-width: 400px; margin: 2rem auto; padding: 2rem; background: rgba(26, 31, 58, 0.6); border: 1px solid rgba(0, 212, 255, 0.2); border-radius: 8px; backdrop-filter: blur(10px);">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="font-size: 2.5rem; margin-bottom: 1rem;">🔐</div>
                <h1 style="color: var(--text-primary); margin: 0; font-size: 1.8rem; font-weight: 600;">Créer un compte</h1>
            </div>
            
            <form id="registerForm">
                <div style="margin-bottom: 1.5rem;">
                    <label for="username" style="display: block; margin-bottom: 0.5rem; color: var(--text-primary); font-weight: 500;">Nom d'utilisateur</label>
                    <input type="text" id="username" name="username" required minlength="3" maxlength="20" placeholder="Votre nom d'utilisateur"
                           style="width: 100%; padding: 0.8rem 1rem; border: 1px solid rgba(0, 212, 255, 0.3); border-radius: 6px; background: rgba(10, 14, 39, 0.8); color: var(--text-primary); font-size: 0.95rem; transition: all 0.3s;">
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label for="email" style="display: block; margin-bottom: 0.5rem; color: var(--text-primary); font-weight: 500;">Email</label>
                    <input type="email" id="email" name="email" required placeholder="Votre adresse email"
                           style="width: 100%; padding: 0.8rem 1rem; border: 1px solid rgba(0, 212, 255, 0.3); border-radius: 6px; background: rgba(10, 14, 39, 0.8); color: var(--text-primary); font-size: 0.95rem; transition: all 0.3s;">
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label for="password" style="display: block; margin-bottom: 0.5rem; color: var(--text-primary); font-weight: 500;">Mot de passe</label>
                    <input type="password" id="password" name="password" required minlength="6" placeholder="Choisissez un mot de passe"
                           style="width: 100%; padding: 0.8rem 1rem; border: 1px solid rgba(0, 212, 255, 0.3); border-radius: 6px; background: rgba(10, 14, 39, 0.8); color: var(--text-primary); font-size: 0.95rem; transition: all 0.3s;">
                </div>
                <div style="margin-bottom: 2rem;">
                    <label for="confirmPassword" style="display: block; margin-bottom: 0.5rem; color: var(--text-primary); font-weight: 500;">Confirmer le mot de passe</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirmez votre mot de passe"
                           style="width: 100%; padding: 0.8rem 1rem; border: 1px solid rgba(0, 212, 255, 0.3); border-radius: 6px; background: rgba(10, 14, 39, 0.8); color: var(--text-primary); font-size: 0.95rem; transition: all 0.3s;">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1.1rem;">
                    S'inscrire
                </button>
            </form>
            
            <div class="form-footer" style="text-align: center; margin-top: 1.5rem; color: var(--text-muted);">
                <p style="margin: 0;">Déjà un compte ? <a href="login.html" style="color: var(--electric-blue); text-decoration: none; font-weight: 500;">Se connecter</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Vérifier que les mots de passe correspondent
            if (password !== confirmPassword) {
                alert('Les mots de passe ne correspondent pas');
                return;
            }
            
            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Stocker le token de session
                    localStorage.setItem('sessionId', data.session_id);
                    localStorage.setItem('userId', data.user_id);
                    localStorage.setItem('username', data.username);
                    
                    // Rediriger vers le chat
                    window.location.href = 'index.html';
                } else {
                    alert(data.error || 'Erreur d\'inscription');
                }
            } catch (error) {
                console.error('Erreur:', error);
                alert('Erreur de connexion au serveur');
            }
        });
    </script>
</body>
</html>
